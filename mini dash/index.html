
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Mini Dash</title>
<style>
  body { margin:0; overflow:hidden; background:#222; font-family:Arial; }
  canvas { display:block; margin:0 auto; background:#111; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = 800;
canvas.height = 400;

// Player
let player = { x:50, y:canvas.height-50, w:30, h:30, dy:0, jumping:false };
let gravity = 0.8;
let jumpForce = -12;

// Obstacles
let obstacles = [];
let score = 0;
let gameOver = false;

// Spike ve blok kontrol
let lastObstacleX = 0; // Önceki engelin x konumu

// Spawn obstacle
function spawnObstacle() {
  let minDistance = 120; // engeller arası minimum mesafe
  let xPos = Math.max(canvas.width, lastObstacleX + minDistance);

  // Rastgele tür
  let type = Math.random() < 0.3 ? 'spike' : 'block'; // %30 spike, %70 blok
  let height = type === 'spike' ? 40 : Math.random() * 50 + 20;

  obstacles.push({ x: xPos, y: canvas.height - height, w: 30, h: height, type: type });
  lastObstacleX = xPos;
}
setInterval(spawnObstacle, 1200);

// Update
function update() {
  if(gameOver) return;

  // Player gravity
  player.dy += gravity;
  player.y += player.dy;

  if(player.y + player.h > canvas.height) {
    player.y = canvas.height - player.h;
    player.dy = 0;
    player.jumping = false;
  }

  // Obstacles move & collision
  for(let i=0;i<obstacles.length;i++){
    obstacles[i].x -= 5;
    let o = obstacles[i];

    // Collision
    if(player.x < o.x + o.w &&
       player.x + player.w > o.x &&
       player.y < o.y + o.h &&
       player.y + player.h > o.y){
         gameOver = true;
         setTimeout(resetGame,1000);
    }

    // Remove offscreen
    if(o.x + o.w < 0){
      obstacles.splice(i,1);
      i--;
      score++;
    }
  }
}

// Draw
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Player
  ctx.fillStyle = "#00ffff";
  ctx.fillRect(player.x,player.y,player.w,player.h);

  // Obstacles
  for(let o of obstacles){
    if(o.type==='spike'){
      ctx.fillStyle="#ff0000";
      ctx.beginPath();
      ctx.moveTo(o.x,o.y+o.h);
      ctx.lineTo(o.x+o.w/2,o.y);
      ctx.lineTo(o.x+o.w,o.y+o.h);
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.fillStyle="#ff5555";
      ctx.fillRect(o.x,o.y,o.w,o.h);
    }
  }

  // Score
  ctx.fillStyle="white";
  ctx.font="20px Arial";
  ctx.fillText("Score: "+score,10,30);

  if(gameOver){
    ctx.fillStyle="yellow";
    ctx.font="40px Arial";
    ctx.fillText("GAME OVER",canvas.width/2-120,canvas.height/2);
  }
}

// Reset game
function resetGame(){
  player = { x:50, y:canvas.height-50, w:30, h:30, dy:0, jumping:false };
  obstacles = [];
  score = 0;
  gameOver = false;
  lastObstacleX = 0;
}

// Loop
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();

// Controls
document.addEventListener('keydown', e => {
  if(e.code === "Space" && !player.jumping && !gameOver){
    player.dy = jumpForce;
    player.jumping = true;
  }
});
document.addEventListener('mousedown', e => {
  if(!player.jumping && !gameOver){
    player.dy = jumpForce;
    player.jumping = true;
  }
});
</script>
</body>
</html>
